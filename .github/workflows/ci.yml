name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 8000
      FRONTEND_URL: http://127.0.0.1:3000
      VITE_API_URL: http://127.0.0.1:8000
      MONGO_URI: mongodb://127.0.0.1:27017/ink-rider-e2e
      DB_NAME: ink-rider-e2e
      JWT_SECRET: ci-test-secret-with-sufficient-entropy
      SEED_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD }}
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: Backend
      - name: Run backend contracts
        run: npm test
        working-directory: Backend
      - name: Run database integration tests
        run: npm run test:integration
        working-directory: Backend
        env:
          RUN_DB_INTEGRATION: true
      - name: Seed browser fixtures
        run: npm run seed:dev
        working-directory: Backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: Frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: Frontend
      - name: Build frontend
        run: npm run build
        working-directory: Frontend
      - name: Run authenticated browser critical flow
        run: npm run test:e2e
        working-directory: Frontend
      - name: Run deployed SEO crawl against seeded CI app
        working-directory: Frontend
        run: |
          export SEO_CRAWL_URL=http://127.0.0.1:3000
          export SEO_CRAWL_POST_PATH="$(cd ../Backend && npm run seo:crawl-target --silent | tail -n 1)"
          (cd ../Backend && nohup node server.js > /tmp/ink-rider-seo-backend.log 2>&1 &)
          nohup npm run dev -- --host 127.0.0.1 > /tmp/ink-rider-seo-frontend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$SEO_CRAWL_URL/robots.txt" >/dev/null && curl --fail --silent "$SEO_CRAWL_URL/sitemap.xml" >/dev/null; then break; fi
            sleep 1
          done
          npm run test:seo
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Frontend/playwright-report/
          if-no-files-found: ignore
